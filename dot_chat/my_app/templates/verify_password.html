{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dot Chat · Register</title>
    <!-- Bootstrap 5 + Font Awesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-image: url({% static 'images/dot_chat_background.png' %});
            background-size: cover;
            min-height: 100vh;
        }
                .verify-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 50px rgba(180, 20, 30, 0.3);
            max-width: 520px;
            width: 100%;
            text-align: center;
        }
        </style>
</head>
<body>
        <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="verify-card">

        <h1>Enter Your Passsword</h1>
        <form method="post" style="margin-top: 20px;">
            {% csrf_token %}
            <label style="font-weight:bold;" for="email">Enter:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit" class="btn btn-dark">Conform</button>
        </form>
        {% if messages %}
            <ul>
                {% for message in messages %}
                    <li>{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}


            </div>
    </div>

</body>
</html>
